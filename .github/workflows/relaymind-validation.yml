name: RelayMind Validation

on:
  push:
    branches:
      - "test/**"
  workflow_dispatch:

concurrency:
  group: relaymind-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Cache local Qwen inference runtime
        uses: actions/cache@v4
        with:
          path: .relaymind
          key: relaymind-qwen25-05b-q4km-llama-b12244-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Provision verified local Qwen runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .relaymind/bin .relaymind/models
          if ! find .relaymind/bin -type f -name llama-cli -print -quit | grep -q .; then
            curl --fail --silent --show-error --location --max-time 60 \
              https://github.com/ggml-org/llama.cpp/releases/download/b12244/llama-b12244-bin-ubuntu-x64.tar.gz \
              -o /tmp/llama-runtime.tar.gz
            echo "c1d7e7f31b5c43f3e5d44f667b4d57104217be3e5f2060320cd3735651238849  /tmp/llama-runtime.tar.gz" | sha256sum -c -
            tar -xzf /tmp/llama-runtime.tar.gz -C .relaymind/bin
          fi
          MODEL=".relaymind/models/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          if [ ! -s "$MODEL" ]; then
            curl --fail --silent --show-error --location --retry 2 --max-time 100 \
              https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf \
              -o "$MODEL"
          fi
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  $MODEL" | sha256sum -c -
          LLAMA_CLI="$(find .relaymind/bin -type f -name llama-cli -print -quit)"
          test -n "$LLAMA_CLI"
          chmod +x "$LLAMA_CLI"
          echo "RELAYMIND_LLAMA_CLI=$PWD/$LLAMA_CLI" >> "$GITHUB_ENV"
          echo "RELAYMIND_MODEL_PATH=$PWD/$MODEL" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/$(dirname "$LLAMA_CLI"):${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Compile Python modules
        run: python -m compileall -q runner.py engine tests
      - name: Run regression and offline-render tests
        run: pytest -q
      - name: Generate live Arabic end-to-end sample
        env:
          TOPIC: "قهوة عربية: من الحبوب إلى الفنجان"
          LANG: ar
        run: python runner.py
      - name: Upload offline and live renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relaymind-validation-output
          path: output/
          if-no-files-found: ignore
          retention-days: 1
