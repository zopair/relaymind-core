name: RelayMind Studio

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video idea (English or Arabic)"
        required: true
        type: string
      language:
        description: "Narration language"
        required: true
        default: auto
        type: choice
        options: [auto, ar, en]

concurrency:
  group: relaymind-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout client repository
        uses: actions/checkout@v4

      - name: Prepare pip cache manifest
        run: printf 'edge-tts>=7.0.0,<8.0.0\nPillow>=10.0.0,<12.0.0\n' > .relaymind-requirements.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .relaymind-requirements.txt

      - name: Install runtime and ffmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .relaymind-requirements.txt
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Download centralized engine from jsDelivr
        run: |
          set -euo pipefail
          mkdir -p engine output
          BASE="https://cdn.jsdelivr.net/gh/zopair/relaymind-core@main"
          curl --fail --silent --show-error --location --max-time 15 "$BASE/runner.py" -o runner.py
          curl --fail --silent --show-error --location --max-time 15 "$BASE/engine/__init__.py" -o engine/__init__.py
          curl --fail --silent --show-error --location --max-time 15 "$BASE/engine/prompt_enhancer.py" -o engine/prompt_enhancer.py
          curl --fail --silent --show-error --location --max-time 15 "$BASE/engine/media_factory.py" -o engine/media_factory.py
          curl --fail --silent --show-error --location --max-time 15 "$BASE/engine/resolver.py" -o engine/resolver.py
          python -m py_compile runner.py engine/*.py

      - name: Detect whether local English model is needed
        id: model-gate
        env:
          TOPIC: ${{ inputs.topic }}
          LANG: ${{ inputs.language }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          lang = os.getenv("LANG", "auto")
          topic = os.getenv("TOPIC", "")
          use_model = lang == "en" or (lang == "auto" and not re.search(r"[\\u0600-\\u06ff]", topic))
          print(f"needs_model={'true' if use_model else 'false'}")
          PY

      - name: Cache local Qwen inference runtime
        if: steps.model-gate.outputs.needs_model == 'true'
        uses: actions/cache@v4
        with:
          path: .relaymind
          key: relaymind-qwen25-15b-q4km-llama-b12244-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Provision verified local Qwen runtime
        if: steps.model-gate.outputs.needs_model == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .relaymind/bin .relaymind/models
          if ! find .relaymind/bin -type f -name llama-cli -print -quit | grep -q .; then
            curl --fail --silent --show-error --location --max-time 60 \
              https://github.com/ggml-org/llama.cpp/releases/download/b12244/llama-b12244-bin-ubuntu-x64.tar.gz \
              -o /tmp/llama-runtime.tar.gz
            echo "c1d7e7f31b5c43f3e5d44f667b4d57104217be3e5f2060320cd3735651238849  /tmp/llama-runtime.tar.gz" | sha256sum -c -
            tar -xzf /tmp/llama-runtime.tar.gz -C .relaymind/bin
          fi
          MODEL=".relaymind/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          if [ ! -s "$MODEL" ]; then
            curl --fail --silent --show-error --location --retry 2 --max-time 100 \
              https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf \
              -o "$MODEL"
          fi
          echo "6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e  $MODEL" | sha256sum -c -
          LLAMA_CLI="$(find .relaymind/bin -type f -name llama-cli -print -quit)"
          test -n "$LLAMA_CLI"
          chmod +x "$LLAMA_CLI"
          echo "RELAYMIND_LLAMA_CLI=$PWD/$LLAMA_CLI" >> "$GITHUB_ENV"
          echo "RELAYMIND_MODEL_PATH=$PWD/$MODEL" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/$(dirname "$LLAMA_CLI"):${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Generate video
        env:
          TOPIC: ${{ inputs.topic }}
          LANG: ${{ inputs.language }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
        run: python runner.py

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relaymind-output
          path: output/
          if-no-files-found: warn
          retention-days: 3
